# XcodeGen-Spezifikation – erzeugt RoteKarte.xcodeproj.
# Nach Änderungen neu generieren: `xcodegen generate`
name: RoteKarte
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

packages:
  RoteKarteCore:
    path: Packages/RoteKarteCore

targets:
  RoteKarte:
    type: application
    platform: iOS
    sources:
      - path: RoteKarte
    dependencies:
      - package: RoteKarteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rotekarte
        PRODUCT_NAME: RoteKarte
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rote Karte
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.kids
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  RoteKarte:
    build:
      targets:
        RoteKarte: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: RoteKarteCore/RoteKarteCoreTests
    archive:
      config: Release
